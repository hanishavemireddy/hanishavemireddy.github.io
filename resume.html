    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fafaf9;
      --surface: #f3f2f0;
      --surface-2: #ffffff;
      --border: #e4e2dc;
      --border-strong: #ccc9c1;
      --text-primary: #1a1a18;
      --text-secondary: #5a5950;
      --text-muted: #9a978d;
      --accent: #185fa5;

    html { scroll-behavior: smooth; }
    body {

    nav {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg);
      border-bottom: 0.5px solid var(--border);
      padding: 16px 0;
    }
    nav .container { display: flex; align-items: center; justify-content: space-between; }
    .nav-name { font-size: 15px; font-weight: 500; color: var(--text-primary); letter-spacing: -0.01em; }
    .nav-links { display: flex; gap: 28px; list-style: none; }
    .nav-links a { font-size: 14px; color: var(--text-secondary); transition: color 0.15s; }
    .nav-links a:hover, .nav-links a.active { color: var(--text-primary); text-decoration: none; font-weight: 500; }

    .page-header {
      padding: 48px 0 32px;
      border-bottom: 0.5px solid var(--border);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }

    .page-title {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 40px; font-weight: 400;
      line-height: 1.15; letter-spacing: -0.02em;
    }

    .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 14px; font-weight: 500;
      padding: 9px 18px;
      border-radius: var(--radius);
      border: 0.5px solid var(--border-strong);
      background: var(--surface-2);
      color: var(--text-primary);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      text-decoration: none;
    }
    .btn:hover { background: var(--surface); border-color: var(--border-strong); text-decoration: none; }
    .btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
    }
    .btn.primary:hover { opacity: 0.9; }

    .pdf-section { padding: 36px 0 48px; }

    .pdf-wrapper {
      border: 0.5px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
    }

    .pdf-embed {
      display: block;
      width: 100%;
      height: 80vh;
      min-height: 600px;
      border: none;
    }

    .pdf-fallback {
      display: none;
      padding: 48px 24px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.6;
    }

    .pdf-fallback a { color: var(--accent); }

    footer {
      border-top: 0.5px solid var(--border);
      padding: 28px 0; text-align: center;
      font-size: 13px; color: var(--text-muted);
    }

    .icon {
      display: inline-block; width: 15px; height: 15px;
      vertical-align: middle; fill: none;
      stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
    }

    @media (max-width: 600px) {
      .page-title { font-size: 30px; }
      .page-header { padding: 36px 0 24px; }
      .pdf-embed { height: 60vh; min-height: 400px; }
    }

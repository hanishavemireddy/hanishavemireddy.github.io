---
layout: default
---

<div class="home-wrapper">

  <div class="home-hero">
    <div class="home-hero-content">
      <h1 class="home-name">{{ site.title }}</h1>
      <p class="home-tagline">
        Data Scientist | Statistics | Machine Learning | Decision Science
      </p>

      <div class="home-intro-block">
        {{ page.intro }}
      </div>
    </div>

    <div class="home-photo-wrap">
      <img
        src="{{ '/assets/files/photo.jpg' | relative_url }}"
        alt="Hanisha Vemireddy"
        class="profile-photo"
      >
    </div>
  </div>

  <div class="featured-work">
    {{ page.featured }}
  </div>

</div>
